<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal Safari</title>
   <style>
    body { position: relative; }
    
    .safari-slide { height: 200px; text-align: center; padding-top: 75px; font-size: 1.8rem; color: white; }
    
    .slide-forest { background: darkgreen; }
    
    .slide-jungle { background: rgb(173, 180, 70); }
    
    .slide-desert { background: orange; }
   
    .slide-ocean { background: rgb(0, 157, 255); }

     .slide-mountain { background: rgb(139, 69, 19); }
      
     .slide-savannah { background: rgb(255, 215, 0); }
    
    .section { padding: 70px 20px; min-height: 300px; }
    
    #forest { background: honeydew; }
    
    #ocean { background: aliceblue; }
    
    #desert { background: lightyellow; }
</style>
</head>
<body data-spy="scroll" data-target="#SafariNav">
    

<div id="safaricarousel" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators">
        <li data-target="#SafariCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#SafariCarousel" data-slide-to="1"></li>
        <li data-target="#SafariCarousel" data-slide-to="2"></li>
        <li data-target="#SafariCarousel" data-slide-to="3"></li>
        <li data-target="#SafariCarousel" data-slide-to="4"></li>
        <li data-target="#SafariCarousel" data-slide-to="5"></li>
    </ol>
    <div class="carousel-inner">
        <div class="carousel-item active safari-slide slide-forest">🙉Forest Safari</div>
        <div class="carousel-item safari-slide slide-jungle">🙈Jungle Safari</div>
        <div class="carousel-item safari-slide slide-desert">🙊Desert Safari</div>
        <div class="carousel-item safari-slide slide-ocean">🐬Ocean Safari</div>
        <div class="carousel-item safari-slide slide-mountain">🐐Mountain Safari</div>
        <div class="carousel-item safari-slide slide-savannah">🦁Savannah Safari</div>
    </div>

    <a class="carousel-control-prev" href="#safaricarousel" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </a>

    <a class="carousel-control-next" href="#safaricarousel" data-slide="next">
        <span class="carousel-control-next-icon"></span>
    </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body> 
</html>
